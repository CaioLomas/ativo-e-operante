<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativo Operante - Home</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <header>
        <h1>Ativo Operante</h1>
        <p>Sistema de Denúncias</p>
    </header>

    <main>
        <div id="mensagem"></div>

        <section id="login-section">
            <h2>Login</h2>
            <form id="login-form">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" required>
                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" required>
                <button type="submit">Entrar</button>
            </form>
            <p style="margin-top:1rem">Não tem conta? <a href="#" id="link-cadastro">Cadastre-se</a></p>
        </section>

        <section id="cadastro-section" style="display:none">
            <h2>Cadastro de Cidadão</h2>
            <form id="cadastro-form">
                <label for="cadastro-cpf">CPF</label>
                <input type="text" id="cadastro-cpf" required>
                <label for="cadastro-email">E-mail</label>
                <input type="email" id="cadastro-email" required>
                <label for="cadastro-senha">Senha</label>
                <input type="password" id="cadastro-senha" required>
                <button type="submit">Cadastrar</button>
            </form>
            <p style="margin-top:1rem">Já tem conta? <a href="#" id="link-login">Faça login</a></p>
        </section>
    </main>

    <script src="/assets/script.js"></script>
</body>
</html>
