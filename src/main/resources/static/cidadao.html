<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativo Operante - Cidadão</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

    <header>
        <h1>Área do Cidadão</h1>
        <nav>
            <button id="btn-nova-denuncia">Nova Denúncia</button>
            <button id="btn-minhas-denuncias">Minhas Denúncias</button>
            <button id="btn-logout">Sair</button>
        </nav>
    </header>

    <main>

        <section id="criar-denuncia-section">
            <h2>Criar Denúncia</h2>
            <form id="denuncia-form">
                <label for="denuncia-titulo">Título</label>
                <input type="text" id="denuncia-titulo" required>

                <label for="denuncia-texto">Descrição</label>
                <textarea id="denuncia-texto" required></textarea>

                <label for="denuncia-urgencia">Urgência (1 a 5)</label>
                <input type="number" id="denuncia-urgencia" min="1" max="5" required>

                <label for="denuncia-orgao">Órgão Competente</label>
                <select id="denuncia-orgao" required></select>

                <label for="denuncia-tipo">Tipo de Problema</label>
                <select id="denuncia-tipo" required></select>

                <label for="denuncia-fotos">Fotos (opcional)</label>
                <input type="file" id="denuncia-fotos" multiple accept="image/*">

                <button type="submit">Enviar Denúncia</button>
            </form>
        </section>

        <section id="minhas-denuncias-section">
            <h2>Minhas Denúncias</h2>
            <div id="denuncias-lista"></div>
        </section>

        <section id="feedback-section">
            <h2>Feedback</h2>
            <div id="feedback-conteudo"></div>
        </section>

    </main>

    <script src="/assets/script.js"></script>
</body>
</html>
